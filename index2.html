<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2주 차 CSS 기본 꾸미기</title>

    <style>
        body {background-color : rgb(246, 252, 255);}
        #main-title {
            text-align: center;
            color: rgba(0, 0, 136, 0.69);
        }
        .first-box {background-color: white;
            padding: 20px;
            margin: 20px;
            box-shadow: 0px 0px 5px 5px rgba(41, 40, 40, 0.262);
        }
        .highlight {color : red}

	</style>
    </head>
<body>
    <h1 id="main-title">웹 개발자 프로필</h1>
    <p>프론트엔드 및 백엔드 기술을 학습 중인 개발자입니다.</p>
    <hr>
    <div class="first-box">
    <h2>보유 기술 Stack (순서 없음)</h2>
    <ul>
        <li class="highlight">Python (기초 문법 및 논리 제어 학습)</li>
        <li>HTML5 (웹 표준 구조 및 태그 마스터)</li>
        <li>JavaScript (향후 동적 제어를 위해 학습 예정)</li>
    </ul>
    </div>
    <div class="first-box">
    <h2>오늘 학습 과제 (순서 있음)</h2>
    <ol>
        <li>HTML 기본 구조 완벽 타이핑 숙달</li>
        <li class="highlight">CSS 박스 모델 수치 계산 및 검증</li>
        <li>생성한 html 파일을 외부 브라우저로 구동 및 검증</li>
    </ol>
    </div>
</body>
</html>
